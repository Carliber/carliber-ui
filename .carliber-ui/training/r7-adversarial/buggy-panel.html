<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务器状态 · 内部面板</title>
<style>
  /* 植入缺陷的测试页 · 评审盲测用(缺陷清单见 00-缺陷清单.md, 评审前不读) */
  :root { --panel:#c6c6c6; --slot:#8b8b8b; --out-l:#fff; --out-d:#555; --in-d:#373737; --in-l:#fff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;
         color:#404040; padding:clamp(12px,2vw,24px); }
  .bar { background:var(--panel); border:9px solid; border-color:var(--out-l) var(--out-d) var(--out-d) var(--out-l);
         padding:12px clamp(12px,2vw,24px); display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .bar h1 { font-size:18px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,1.5vw,18px); margin-top:14px; }
  .panel { background:var(--panel); border:9px solid;
           border-color:var(--out-l) var(--out-d) var(--out-d) var(--out-l); padding:12px; }
  .panel h2 { font-size:15px; margin-bottom:9px; }
  .panel h2::before { content:"| "; color:#1190FF; font-weight:700; }
  .row { display:flex; align-items:center; gap:9px; background:var(--slot);
         border:3px solid; border-color:var(--in-d) var(--in-l) var(--in-l) var(--in-d);
         padding:6px 12px; margin-bottom:6px; }
  .row .name { font-weight:700; flex:1; }
  .v { font-family:Consolas,monospace; }
  .ghost-btn { margin-top:9px; height:36px; padding:0 21px;
    background:linear-gradient(#6b6b6b,#707070 40%,#565656); border:3px solid #030303;
    box-shadow:inset 0 3px 0 #aaa; color:#e0e0e0; font:inherit; cursor:pointer; }
  .low { color:#9e9e9e; font-size:13px; }
  .tpsa { color:#2779aa; font-weight:700; }
  .note { font-size:12px; color:#373737; margin-top:4px; }
  a.more { font-size:13px; }
</style>
</head>
<body>
<div class="bar"><h1>服务器状态</h1><span style="font-size:13px;color:#373737;">内网测试服</span></div>

<div class="grid">
  <div class="panel">
    <h2>实时指标</h2>
    <div class="row"><span class="name">TPS</span><span class="v tpsa">19.2</span><span class="note">正常</span></div>
    <div class="row"><span class="name">在线</span><span class="v">6 / 20</span></div>
    <div class="row"><span class="name">内存</span><span class="v">71%</span></div>
    <div class="row low"><span class="name">备用通道状态</span><span class="v">channel-2 standby</span></div>
    <button class="ghost-btn">此按钮未接入,仅占位示意</button>
  </div>

  <div class="panel">
    <h2>玩家在线</h2>
    <div class="row"><span class="name">tongxl</span><span class="v">38ms</span></div>
    <div class="row"><span class="name">Steve_CN</span><span class="v">52ms</span></div>
    <div class="row"><span class="name">builder_li 🧱</span><span class="v">57ms</span></div>
    <div class="row"><span class="name">farmer_wang</span><span class="v">71ms</span></div>
    <div class="row"><span class="name">redstone_k</span><span class="v">49ms</span></div>
    <div class="row"><span class="name">ender_P</span><span class="v">88ms</span></div>
    <a class="more" href="#" onclick="return false">查看全部玩家</a>
  </div>

  <div class="panel">
    <h2>昨日经济</h2>
    <div class="row"><span class="name">金币流入</span><span class="v">5,200</span></div>
    <div class="row"><span class="name">金币流出</span><span class="v">4,400</span></div>
    <div class="row"><span class="name">成交笔数</span><span class="v">186 笔</span></div>
  </div>

  <div class="panel">
    <h2>异常事件</h2>
    <div class="row low"><span class="name">磁盘余量</span><span class="v">9%</span></div>
    <div class="row"><span class="name">重启次数(7d)</span><span class="v">0</span></div>
  </div>
</div>
</body>
</html>
