<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>白名单申请 · R1 表单六态</title>
<style>
  /* 基线同 cockpit: 1 GUI px = 3 CSS px; 聚焦白边 GuiTextField; 错误 #ffa8a8 */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --panel:#c6c6c6; --slot:#8b8b8b; --out-l:#fff; --out-d:#555;
          --in-d:#373737; --in-l:#fff; --ink:#404040; --txt-d:#e0e0e0;
          --err-b:#ffa8a8; --ok:#7fd47f; }
  body { background:#1a1a1a; font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); display:flex; justify-content:center; padding:clamp(12px,3vw,36px); }
  .topnav { max-width:560px; margin:0 auto 12px; display:flex; gap:18px; }
  .topnav a { color:#9fb8d8; font-size:13px; text-decoration:none; }
  .topnav a:hover { color:#d6e4f8; }
  .win { width:min(560px,94vw); background:var(--panel); border:9px solid;
         border-color:var(--out-l) var(--out-d) var(--out-d) var(--out-l); padding:24px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { font-size:13px; color:#373737; margin-bottom:21px; }

  .field { margin-bottom:18px; }
  label { display:block; font-size:14px; margin-bottom:6px; }
  label .req { color:#c64545; }
  .hint { font-size:12px; color:#373737; margin-top:3px; }
  .err-msg { display:none; font-size:12.5px; color:#8f2f24; margin-top:3px; }
  .field.invalid .err-msg { display:block; }

  /* 输入框: 黑底 GuiTextField; 默认灰边, 聚焦白边, 错误 #ffa8a8 */
  input[type=text], textarea {
    width:100%; background:#000; border:3px solid #a0a0a0; color:var(--txt-d);
    font:14px/1.6 Consolas,"Courier New",monospace; padding:6px 9px; outline:none; }
  input:focus, textarea:focus { border-color:#fff; }
  .field.invalid input, .field.invalid textarea { border-color:var(--err-b); }
  textarea { resize:none; height:81px; }
  .count { text-align:right; font-size:12px; color:#373737; margin-top:3px; }
  .count.over { color:#8f2f24; }

  /* 单选: 按钮组(选中 = widgets 悬停蓝紫态, 视觉即选中) */
  .seg { display:flex; gap:9px; flex-wrap:wrap; }
  .seg button { flex:1; min-width:120px; height:36px; background:linear-gradient(#6b6b6b,#707070 40%,#565656);
    border:3px solid #030303; box-shadow:inset 0 3px 0 #aaa; color:var(--txt-d);
    font:inherit; font-size:13px; cursor:pointer; }
  .seg button:hover { background:linear-gradient(#a6a6a6,#999 40%,#7d7d7d); color:var(--warn,#ffffa0); }
  .seg button[aria-pressed=true] { background:linear-gradient(#bec7ff,#808ac1 40%,#5c669d); color:var(--warn,#ffffa0); }
  .field.invalid .seg button { border-color:var(--err-b); }

  /* 勾选: MC checkbox 感 */
  /* 勾选: 自绘像素方块(替代浏览器原生白块+蓝勾) */
  .check { display:flex; align-items:flex-start; gap:9px; cursor:pointer; }
  .check input { position:absolute; opacity:0; width:0; height:0; }
  .check .box { width:18px; height:18px; margin-top:3px; flex:none; background:#000;
    border:3px solid #a0a0a0; position:relative; }
  .check input:focus + .box { border-color:#fff; }
  .check input:checked + .box { border-color:var(--in-d); background:var(--ok); }
  .check input:checked + .box::after { content:""; position:absolute; left:3px; top:1px;
    width:8px; height:4px; border-left:3px solid #0f3d0f; border-bottom:3px solid #0f3d0f;
    transform:rotate(-45deg); }
  .field.invalid .check .box { border-color:var(--err-b); }
  .check span { font-size:13px; }
  /* 基线 #1190FF 是黑底语境色, 浅灰底用其可读深档(实测 3.5:1+) */
  .check a { color:#0a5bb5; }

  /* 提交行: widgets 按钮; disabled=A0A0A0 文字+暗渐变; submitting=锁定 */
  .submit-row { margin-top:24px; display:flex; align-items:center; gap:15px; }
  .submit { min-width:180px; height:42px; background:linear-gradient(#6b6b6b,#707070 40%,#565656);
    border:3px solid #030303; box-shadow:inset 0 3px 0 #aaa; color:var(--txt-d);
    font:inherit; font-size:15px; cursor:pointer; }
  .submit:hover:not(:disabled) { background:linear-gradient(#bec7ff,#808ac1 40%,#5c669d); color:#ffffa0; }
  .submit:disabled { background:linear-gradient(#4a4a4a,#404040 40%,#3a3a3a); color:#a0a0a0;
    cursor:not-allowed; box-shadow:none; }
  .state-tip { font-size:12.5px; color:#373737; }

  /* 成功面板: 替换整表单 */
  .success { display:none; text-align:center; padding:24px 0; }
  .win.done .form, .win.done .submit-row { display:none; }
  .win.done .success { display:block; }
  .checkmark { width:54px; height:54px; margin:0 auto 15px; background:var(--ok);
    border:3px solid var(--in-d); position:relative; }
  .checkmark::after { content:""; position:absolute; left:12px; top:15px; width:24px; height:12px;
    border-left:6px solid #0f3d0f; border-bottom:6px solid #0f3d0f;
    transform:rotate(-45deg); }
  .success h2 { font-size:17px; margin-bottom:9px; }
  .success p { font-size:13.5px; color:#373737; margin-bottom:21px; }
  .back { height:36px; padding:0 24px; background:linear-gradient(#6b6b6b,#707070 40%,#565656);
    border:3px solid #030303; box-shadow:inset 0 3px 0 #aaa; color:var(--txt-d);
    font:inherit; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="../../cockpit-demo/cockpit.html">← 驾驶舱</a>
  <a href="../../r2-viz/economy.html">经济周报</a>
  <a href="../r3-nav/players.html">排行榜</a>
</nav>
<div class="win" id="win">
  <h1>白名单申请</h1>
  <div class="sub">提交后由服主人工审核,结果在论坛通知。</div>

  <form class="form" id="form" novalidate>
    <div class="field" id="f-id">
      <label for="mcid">MC ID <span class="req">*</span></label>
      <input type="text" id="mcid" placeholder="你的游戏 ID" autocomplete="off">
      <div class="err-msg" id="e-id">ID 只能含字母、数字、下划线,长度 3–16</div>
    </div>

    <div class="field" id="f-src">
      <label>你从哪里知道本服务器 <span class="req">*</span></label>
      <div class="seg" id="seg">
        <button type="button" data-v="朋友邀请">朋友邀请</button>
        <button type="button" data-v="论坛">论坛</button>
        <button type="button" data-v="其他">其他</button>
      </div>
      <div class="err-msg" id="e-src">选一个来源,方便服主认识你</div>
    </div>

    <div class="field">
      <label for="msg">留言(选填)</label>
      <textarea id="msg" placeholder="想对服主说的话,比如常玩时段、擅长的事"></textarea>
      <div class="count mono" id="count">0 / 140</div>
    </div>

    <div class="field" id="f-rule">
      <label class="check"><input type="checkbox" id="rule"><span class="box"></span>
        <span>我已读<a href="#" onclick="return false">服务器规则</a>:不损坏他人建筑、不使用作弊客户端 <span class="req">*</span></span></label>
      <div class="err-msg" id="e-rule">需要先勾选阅读确认</div>
    </div>

    <div class="submit-row">
      <button type="submit" class="submit" id="go" disabled>提交申请</button>
      <span class="state-tip" id="tip">填完必填项后可提交</span>
    </div>
  </form>

  <div class="success" id="ok">
    <div class="checkmark"></div>
    <h2>申请已提交</h2>
    <p>服主会在 24 小时内审核,结果发到论坛通知。<br>期间你可以先在论坛认识大家。</p>
    <button class="back" id="again">再填一份(帮朋友)</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const win = $('win'), form = $('form'), go = $('go'), tip = $('tip');
let src = '', touched = { id:false, src:false, rule:false };

// 校验规则
const badId = v => !/^[a-zA-Z0-9_]{3,16}$/.test(v);
const checks = {
  id:    () => touched.id    && (badId($('mcid').value.trim()) ? 'f-id'  : null),
  src:   () => touched.src   && (src ? null : 'f-src'),
  rule:  () => touched.rule  && (!$('rule').checked ? 'f-rule' : null),
};
function paint() {
  for (const k in checks) {
    const bad = checks[k]();
    const map = { 'f-id':'e-id', 'f-src':'e-src', 'f-rule':'e-rule' };
    const f = $(['f-id','f-src','f-rule'][['id','src','rule'].indexOf(k)]);
    f.classList.toggle('invalid', !!bad);
  }
}
function refresh() {
  paint();
  const idOk = !badId($('mcid').value.trim());
  const ready = idOk && src && $('rule').checked;
  go.disabled = !ready;
  tip.textContent = $('mcid').value.trim() && !idOk ? '先修正 ID 格式'
                  : !src ? '选一个来源' : !$('rule').checked ? '勾选规则确认'
                  : ready ? '可以提交了' : '填完必填项后可提交';
}
// 交互触发状态(错误只在触碰后显示)
$('mcid').addEventListener('input', () => { touched.id = true; refresh(); });
$('mcid').addEventListener('blur',  () => { touched.id = true; refresh(); });
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  src = b.dataset.v; touched.src = true;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  refresh();
});
$('rule').addEventListener('change', () => { touched.rule = true; refresh(); });
$('msg').addEventListener('input', e => {
  if (e.target.value.length > 140) e.target.value = e.target.value.slice(0, 140); // 先截断
  const n = e.target.value.length;
  const c = $('count'); c.textContent = n + ' / 140'; c.classList.toggle('over', n > 140);
});
// 提交中 → 成功
form.addEventListener('submit', e => {
  e.preventDefault(); touched = { id:true, src:true, rule:true }; refresh();
  const firstBad = ['f-id','f-src','f-rule'].find(id => $(id).classList.contains('invalid'));
  if (firstBad || go.disabled) { $(firstBad || 'f-id').scrollIntoView({ block:'center' }); return; }
  go.disabled = true; go.textContent = '提交中…'; tip.textContent = '正在发送到服务器…';
  setTimeout(() => { win.classList.add('done'); }, 900);
});
$('again').addEventListener('click', () => {
  win.classList.remove('done'); form.reset(); src = '';
  document.querySelectorAll('#seg button').forEach(x => x.removeAttribute('aria-pressed'));
  go.textContent = '提交申请'; touched = { id:false, src:false, rule:false }; refresh();
});
refresh();
</script>
</body>
</html>
